name: Backend Lint

on:
  # Scoped on push, whole on pull_request. Root CLAUDE.md's "## CI" section owns why.
  push:
    paths:
      - 'phsar/**'
      - '!phsar/frontend/**'
      - '.github/workflows/backend-lint.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: phsar/

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run Ruff (lint + import order)
      run: ruff check .
