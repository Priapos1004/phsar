name: Backend Tests

on:
  # Scoped on push, whole on pull_request. Root CLAUDE.md's "## CI" section owns why.
  push:
    paths:
      - 'phsar/**'
      - '!phsar/frontend/**'
      # Frontend files a backend test reads — a later pattern re-includes them.
      - 'phsar/frontend/USER_FLOWS.md'
      - 'phsar/frontend/src/lib/stores/browseRefinements.ts'
      - 'phsar/frontend/src/lib/utils/ratingLimits.ts'
      - 'phsar/frontend/src/lib/utils/search.ts'
      - '.github/workflows/backend-test.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: phsar/

    env:
      DB_USER: testuser
      DB_PASSWORD: testpassword
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: testdb
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: adminpassword
      SECRET_KEY: ci-test-secret-key
      SEARCH_SECRET_KEY: ci-test-search-secret-key
      MY_ANIME_LIST_CLIENT_ID: ci-test-mal-client-id

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        # Default is **/requirements.txt, which would leave the torch pin out of
        # the key — bumping it would hit a stale cache and re-pull the wheel forever.
        cache-dependency-path: phsar/requirements*.txt

    # Before requirements.txt; the file it installs explains why.
    - name: Install CPU-only torch
      run: pip install -r requirements-torch.txt

    - name: Install dependencies
      run: pip install -r requirements.txt -r requirements-dev.txt

    # The pg17 service container needs a matching pg17 client: ubuntu-latest
    # ships postgresql-client-16, and pg_dump refuses to dump a newer server
    # ("server version mismatch"). Install the v17 client from PGDG and put it
    # first on PATH so the backup tests' bare `pg_dump`/`pg_restore` calls
    # resolve to v17 — keeping CI's client + server aligned with prod (pg17).
    - name: Install PostgreSQL 17 client
      run: |
        curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
          | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
        echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get update
        sudo apt-get install -y postgresql-client-17
        echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

    - name: Type check
      run: mypy

    - name: Run tests
      run: pytest --tb=short -q
