name: Backend Tests

on:
  # Scoped on push, whole on pull_request. Root CLAUDE.md's "## CI" section owns why.
  push:
    paths:
      - 'phsar/**'
      - '!phsar/frontend/**'
      # Frontend files a backend test reads — a later pattern re-includes them.
      - 'phsar/frontend/USER_FLOWS.md'
      - 'phsar/frontend/src/lib/stores/browseRefinements.ts'
      - 'phsar/frontend/src/lib/utils/ratingLimits.ts'
      - 'phsar/frontend/src/lib/utils/search.ts'
      - 'phsar/frontend/src/tests/fixtures/readiness-cases.json'
      - '.github/workflows/backend-test.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: phsar/

    env:
      DB_USER: testuser
      DB_PASSWORD: testpassword
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: testdb
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: adminpassword
      SECRET_KEY: ci-test-secret-key
      SEARCH_SECRET_KEY: ci-test-search-secret-key
      MY_ANIME_LIST_CLIENT_ID: ci-test-mal-client-id

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      id: python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # The installed virtualenv, not pip's download cache: unpacking the wheels — torch's
    # above all — is most of what an install costs. Keyed on the exact interpreter the
    # venv links to and on every requirements file, torch's pin included.
    - name: Cache the virtualenv
      id: venv
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('phsar/requirements*.txt') }}

    # Torch before requirements.txt; requirements-torch.txt explains why.
    - name: Install dependencies
      if: steps.venv.outputs.cache-hit != 'true'
      run: |
        python -m venv ../.venv
        ../.venv/bin/pip install -r requirements-torch.txt
        ../.venv/bin/pip install -r requirements.txt -r requirements-dev.txt

    - name: Use the virtualenv
      run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

    # The embedding model the suite loads at import, otherwise downloaded from the Hub
    # on every run.
    - name: Cache the embedding model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-${{ hashFiles('phsar/app/services/vector_embedding_service.py') }}
        restore-keys: |
          hf-

    # mypy's incremental cache: a run restores the latest and re-checks what changed.
    - name: Cache mypy
      uses: actions/cache@v4
      with:
        path: phsar/.mypy_cache
        key: mypy-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('phsar/requirements*.txt') }}-${{ hashFiles('phsar/app/**/*.py') }}
        restore-keys: |
          mypy-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('phsar/requirements*.txt') }}-

    # The pg17 service container needs a matching pg17 client: ubuntu-latest
    # ships postgresql-client-16, and pg_dump refuses to dump a newer server
    # ("server version mismatch"). Install the v17 client from PGDG and put it
    # first on PATH so the backup tests' bare `pg_dump`/`pg_restore` calls
    # resolve to v17 — keeping CI's client + server aligned with prod (pg17).
    - name: Install PostgreSQL 17 client
      run: |
        curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
          | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
        echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get update
        sudo apt-get install -y postgresql-client-17
        echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

    - name: Type check
      run: mypy

    # Fewer workers than vCPUs: Postgres runs on the same cores, and a worker per core
    # contends with it.
    - name: Run tests
      run: pytest -n 3 --tb=short -q
