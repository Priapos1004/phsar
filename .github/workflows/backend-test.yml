name: Backend Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: phsar/

    env:
      DB_USER: testuser
      DB_PASSWORD: testpassword
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: testdb
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: adminpassword
      SECRET_KEY: ci-test-secret-key
      SEARCH_SECRET_KEY: ci-test-search-secret-key
      MY_ANIME_LIST_CLIENT_ID: ci-test-mal-client-id

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # Match the Dockerfile: install CPU-only torch from the PyTorch CPU
    # index BEFORE requirements.txt, so sentence-transformers doesn't
    # pull the default CUDA torch wheel (~890 MB vs ~190 MB CPU). CI has
    # no GPU; the CUDA build was dead weight that bloated the pip cache
    # to ~2.5 GiB per branch and blew the Actions cache budget.
    - name: Install CPU-only torch
      run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu

    - name: Install dependencies
      run: pip install -r requirements.txt

    # The pg17 service container needs a matching pg17 client: ubuntu-latest
    # ships postgresql-client-16, and pg_dump refuses to dump a newer server
    # ("server version mismatch"). Install the v17 client from PGDG and put it
    # first on PATH so the backup tests' bare `pg_dump`/`pg_restore` calls
    # resolve to v17 — keeping CI's client + server aligned with prod (pg17).
    - name: Install PostgreSQL 17 client
      run: |
        curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
          | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
        echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get update
        sudo apt-get install -y postgresql-client-17
        echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

    # Guards two things at once, in seconds and with no file written:
    #  1. Models and migrations agree — an index or column declared in only one
    #     of the two is exactly what makes the next `--autogenerate` propose a
    #     destructive diff nobody reads closely.
    #  2. The migration chain still replays from empty. Nothing else in CI does
    #     this: the test DB below is built by `create_all`, so the chain is
    #     never exercised end to end.
    #
    # It needs its OWN database, built by replaying the chain. Run it against
    # `testdb` and it would compare `create_all`'s metadata to the same
    # metadata, passing no matter how far the migrations had drifted. The
    # step-level DB_NAME override is enough — alembic/env.py builds its URL from
    # `settings`, and env vars outrank .env. The migrations create their own
    # extensions (vector, pg_trgm), so there is nothing to set up.
    - name: Check migrations replay and match models
      env:
        DB_NAME: migrationcheck
        PGPASSWORD: testpassword
      run: |
        psql -h localhost -U testuser -d postgres -c 'CREATE DATABASE migrationcheck'
        alembic upgrade head
        alembic check

    - name: Create database schema and seed
      run: |
        python -c "
        import asyncio
        from app.core.db import engine, async_session_maker, Base
        from sqlalchemy import text
        import app.models  # registers all models with Base.metadata
        from app.seeders.user_seeder import seed_admin_user
        from app.seeders.genre_seeder import seed_genres
        async def setup():
            async with engine.begin() as conn:
                await conn.execute(text('CREATE EXTENSION IF NOT EXISTS vector'))
                await conn.execute(text('CREATE EXTENSION IF NOT EXISTS pg_trgm'))
                await conn.run_sync(Base.metadata.create_all)
            async with async_session_maker() as session:
                await seed_genres(session)
                await seed_admin_user(session)
        asyncio.run(setup())
        "
        # `alembic_version` is Alembic-managed, so `create_all` never builds it —
        # and the backup tests read it to compare a dump's stamped revision
        # against the live DB's. Stamp (not `upgrade head`) because the schema is
        # already at head from `create_all`; this only writes the version row.
        alembic stamp head

    - name: Run tests
      run: pytest --tb=short -q
