[tool.ruff]
# Bind the version here rather than only in requirements-dev.txt, because that file
# governs only what CI and a fresh dev install get. review-gate.sh runs whatever
# `ruff` is on the developer's PATH, so without this a green local gate can still
# land findings in CI. Ruff enforces this itself and fails loudly on a mismatch.
required-version = ">=0.16,<0.17"

# Paths to exclude
exclude = [
    "alembic/versions",
    "**/__init__.py"
]

[tool.ruff.lint]
# Curated rule set (NOT ruff's full default): pycodestyle errors + Pyflakes, plus import
# sorting and the high-value modern-convention categories. We deliberately omit the
# categories that fight this project's deliberate patterns — pylint complexity limits (large
# service functions), blind-except (the job worker's hardened catch-alls), and bandit noise.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF", "RET", "ASYNC"]
# RUF00{1,2,3} flag em-dashes / typographic quotes in prose as "ambiguous unicode"; this
# project uses them intentionally throughout docstrings + comments. ASYNC240 flags
# pathlib methods in async functions — the backup/restore worker does deliberate
# synchronous filesystem ops off the request path (pg_dump/pg_restore dominate).
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC240"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection + parameter helpers are called in argument defaults by
# design; treat them as immutable so B008 stays useful for genuinely-mutable defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]
[tool.mypy]
python_version = "3.12"
files = ["app"]
# pydantic.mypy teaches mypy that BaseSettings fields arrive from the environment
# and how the response DTOs construct; without it a third of the output is false
# positives about arguments the framework supplies. Not the SQLAlchemy plugin — the
# ORM is typed through `Mapped[]`, which needs none.
plugins = ["pydantic.mypy"]
# Prospective: without this, the next function written without annotations takes
# its whole body outside the checker, silently.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Imports app/ makes that carry no types. mypy errors on a new one, so this list
# cannot silently fall behind.
[[tool.mypy.overrides]]
module = ["pgvector.*", "jose.*", "passlib.*"]
ignore_missing_imports = true
